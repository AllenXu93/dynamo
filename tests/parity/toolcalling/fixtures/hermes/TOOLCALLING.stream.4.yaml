family: hermes
model_label: Hermes-3 / Llama variants
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    description: Truncated stream terminates after a complete in-flight tool-call body
    ref: derived from TOOLCALLING.batch.5.a
    chunks:
    - delta_text: '<tool_call>{"name": "get_weather", "arguments": {"location": "NYC"}}'
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        reason: Hermes intentionally drops a single tool call whose closing </tool_call> never arrived; on the stream-finalize path the partial buffer is hidden (empty normal_text). NOT parity - vLLM and SGLang both recover the call - it is a deliberate hermes behavior.
        calls: []
        normal_text: ''
      sglang: &id001
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
      vllm: *id001
  TOOLCALLING.stream.4.b:
    description: Stream terminates mid-call body before the in-flight argument payload is complete
    ref: derived from TOOLCALLING.batch.5.c
    chunks:
    - delta_text: '<tool_call>{"name": "get_w'
    - delta_text: 'eather", "arguments": {"loc'
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: ''
      sglang:
        reason: SGLang emits a get_weather call with empty arguments when the stream stops mid-argument; Dynamo drops the incomplete call and hides the partial <tool_call> buffer rather than leaking it, matching nemotron/kimi/deepseek.
        calls:
        - name: get_weather
          arguments: {}
        normal_text: ''
      vllm:
        reason: vLLM emits a get_weather call carrying the raw partial argument fragment when the stream stops mid-argument; Dynamo drops the incomplete call and hides the partial <tool_call> buffer rather than leaking it, matching nemotron/kimi/deepseek.
        calls:
        - name: get_weather
          arguments: '{"loc'
        normal_text: ''
  TOOLCALLING.stream.4.c:
    description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by
      repeated close markers
    ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
    chunks:
    - delta_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call></tool_call></tool_call>'
    - delta_text: ''
      finish_reason: length
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo: &id002
        calls: []
        normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}</tool_call></tool_call></tool_call>'
      vllm: *id002
      sglang:
        reason: With no opening <tool_call> marker the inner body was never a framed tool call, so Dynamo (and vLLM) pass the buffer through as content verbatim, consistent with nemotron's identical orphan-close behavior. SGLang strips the trailing close markers. The stream-finalize partial-markup drop does not apply here because the buffer carries no <tool_call> opener.
        calls: []
        normal_text: '{"name": "get_weather", "arguments": {"location": "NYC"}}'
